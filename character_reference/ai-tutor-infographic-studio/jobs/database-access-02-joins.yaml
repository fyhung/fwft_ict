job:
  id: "database-access-02-joins"
  series:
    zh: "數據庫"
    en: "Database / Access"
  topic:
    zh: "四種資料表連接"
    en: "Four Types of JOIN"
  objective: "用簡潔圖示分辨 RIGHT JOIN、INNER JOIN、FULL JOIN 與 CROSS JOIN 的結果。"
  coverage:
    - "右連接（RIGHT JOIN）：保留右表全部記錄，配對左表資料。"
    - "內連接（INNER JOIN）：只保留兩表都有配對的記錄。"
    - "全連接（FULL JOIN）：保留兩表所有記錄，沒有配對的位置顯示空白。"
    - "交叉連接（CROSS JOIN）：左表每一列配對右表每一列。"
  source_files: []

