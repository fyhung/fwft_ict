const PALETTE=['#7F1D1D','#DC2626','#FB7185','#FDA4AF','#9A3412','#EA580C','#FB923C','#FDBA74','#854D0E','#CA8A04','#FACC15','#FDE68A','#14532D','#16A34A','#4ADE80','#BBF7D0','#134E4A','#0D9488','#2DD4BF','#99F6E4','#1E3A8A','#2563EB','#60A5FA','#BFDBFE','#581C87','#9333EA','#C084FC','#E9D5FF','#831843','#DB2777','#F472B6','#FBCFE8','#111827','#475569','#94A3B8','#E2E8F0'];
let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(error){saved={}}
let selectedIds=Array.isArray(saved.selectedIds)?saved.selectedIds:[1,2,63];
let activePeriod=typeof saved.activePeriod==='string'?saved.activePeriod:'M1', query='', commonOnly=Boolean(saved.commonOnly),showFree=Boolean(saved.showFree),openPaletteId=null,yourselfId=Number(saved.yourselfId)||null,leftCollapsed=Boolean(saved.leftCollapsed),rightCollapsed=Boolean(saved.rightCollapsed),hiddenIds=[],draggedId=null;
let customizations=saved.customizations&&typeof saved.customizations==='object'?saved.customizations:{};
const byId=new Map(DATA.teachers.map(t=>[t.id,t]));
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const textColor=hex=>{const value=hex.replace('#',''),r=parseInt(value.slice(0,2),16),g=parseInt(value.slice(2,4),16),b=parseInt(value.slice(4,6),16);return (r*299+g*587+b*114)/1000>155?'#17201f':'#ffffff'};
const status=value=>value==='12'?'free':value==null||String(value).trim()===''?'unknown':'busy';
const selectedAll=()=>selectedIds.map(id=>byId.get(id)).filter(Boolean);
const selected=()=>selectedAll().filter(t=>!hiddenIds.includes(t.id));
const profile=teacher=>({color:customizations[teacher.id]?.color||PALETTE[(teacher.id-1)%PALETTE.length],emoji:customizations[teacher.id]?.emoji||''});
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({selectedIds,activePeriod,commonOnly,showFree,yourselfId,leftCollapsed,rightCollapsed,customizations}))}catch(error){}}
function applyPanels(){const shell=document.getElementById('app-shell');shell.classList.toggle('left-collapsed',leftCollapsed);shell.classList.toggle('right-collapsed',rightCollapsed);document.getElementById('toggle-left').setAttribute('aria-pressed',String(!leftCollapsed));document.getElementById('toggle-right').setAttribute('aria-pressed',String(!rightCollapsed))}

function renderTeachers(){
  const needle=query.trim().toLowerCase();
  const list=DATA.teachers.filter(t=>(t.englishName+' '+t.chineseName+' '+t.shortName).toLowerCase().includes(needle));
  document.getElementById('teacher-list').innerHTML=list.map(t=>{const checked=selectedIds.includes(t.id),isSelf=yourselfId===t.id,p=profile(t),icon=p.emoji||t.shortName||t.englishName[0],palette=PALETTE.map(color=>'<button class="palette-swatch" data-color-choice="'+t.id+'" data-color-value="'+color+'" style="background:'+color+'" title="Use '+color+'"></button>').join('');return '<div class="teacher-option '+(checked?'is-selected':'')+'"><button class="teacher-select" data-id="'+t.id+'" aria-pressed="'+checked+'"><span class="avatar" style="background:'+esc(p.color)+';color:'+textColor(p.color)+'">'+esc(icon)+'</span><span class="teacher-copy"><strong>'+esc(t.englishName)+(isSelf?'<span class="yourself-tag">You</span>':'')+'</strong><small>'+esc(t.chineseName)+'</small></span></button><span class="palette-picker"><button class="palette-button" data-palette-toggle="'+t.id+'" style="background:'+esc(p.color)+'" title="Choose colour from palette"></button>'+(openPaletteId===t.id?'<span class="palette-menu">'+palette+'</span>':'')+'</span><input class="emoji-input" data-emoji="'+t.id+'" value="'+esc(p.emoji)+'" maxlength="8" placeholder="🙂" title="Choose an emoji"><button class="self-button '+(isSelf?'is-self':'')+'" data-self="'+t.id+'" title="'+(isSelf?'Remove Yourself':'Set as Yourself')+'">★</button></div>'}).join('');
  document.querySelectorAll('.teacher-select').forEach(button=>button.addEventListener('click',()=>{const id=Number(button.dataset.id);if(selectedIds.includes(id)){selectedIds=selectedIds.filter(x=>x!==id);hiddenIds=hiddenIds.filter(x=>x!==id);if(yourselfId===id)yourselfId=null}else{selectedIds=[...selectedIds,id]}saveState();renderAll()}));
  document.querySelectorAll('[data-palette-toggle]').forEach(button=>button.addEventListener('click',()=>{const id=Number(button.dataset.paletteToggle);openPaletteId=openPaletteId===id?null:id;renderTeachers()}));
  document.querySelectorAll('[data-color-choice]').forEach(button=>button.addEventListener('click',()=>{const id=Number(button.dataset.colorChoice);customizations[id]={...customizations[id],color:button.dataset.colorValue};openPaletteId=null;saveState();renderAll()}));
  document.querySelectorAll('[data-emoji]').forEach(input=>input.addEventListener('change',()=>{const id=Number(input.dataset.emoji);customizations[id]={...customizations[id],emoji:input.value.trim()};saveState();renderAll()}));
  document.querySelectorAll('[data-self]').forEach(button=>button.addEventListener('click',()=>{const id=Number(button.dataset.self);yourselfId=yourselfId===id?null:id;if(yourselfId){if(!selectedIds.includes(id))selectedIds=[...selectedIds,id];hiddenIds=hiddenIds.filter(x=>x!==id)}saveState();renderAll()}));
}

function renderSchedule(){
  const chosen=selected(); document.getElementById('selected-count').textContent=chosen.length;
  if(!chosen.length){document.getElementById('schedule').innerHTML='<div class="empty-state"><span>＋</span><h3>Select at least one teacher</h3><p>The timetable will compare everyone you choose.</p></div>';return}
  let out='<div class="timetable" role="grid"><div class="corner-cell">Period</div>'+DAYS.map(d=>'<div class="day-header">'+d.name+'</div>').join('');
  for(let lesson=1;lesson<=10;lesson++){
    out+='<div class="grid-row"><div class="period-number"><span>'+lesson+'</span></div>';
    for(const day of DAYS){
      if(lesson>day.count){out+='<div class="period-cell unavailable">—</div>';continue}
      const code=day.short+lesson, states=chosen.map(t=>status(t.periods[code]));
      const free=states.filter(x=>x==='free').length, unknown=states.filter(x=>x==='unknown').length, allFree=free===chosen.length;
      const state=allFree?'all-free':free?'partial':unknown?'unknown':'busy';
      const level=Math.max(0,Math.min(5,Math.round((free/chosen.length)*5)));
      const busyTeachers=chosen.filter(t=>status(t.periods[code])==='busy');
      const freeTeachers=chosen.filter(t=>status(t.periods[code])==='free');
      const displayedTeachers=(showFree?freeTeachers:busyTeachers).filter(t=>t.id!==yourselfId);
      const initials=displayedTeachers.map(t=>{const p=profile(t);return '<span class="busy-initial" style="background:'+esc(p.color)+';border-color:'+esc(p.color)+';color:'+textColor(p.color)+'" title="'+esc(t.englishName)+'">'+esc(p.emoji||t.shortName||t.englishName[0])+'</span>'}).join('');
      const self=yourselfId?byId.get(yourselfId):null;
      let selfInfo='';
      if(self){const selfState=status(self.periods[code]),selfColor=profile(self).color;if(selfState==='free'){selfInfo=''}else if(selfState==='unknown'){selfInfo='<span class="self-lesson" style="color:'+esc(selfColor)+'"><strong>No data</strong></span>'}else{const detail=self.details?.[code]||{},classLabel=detail.className&&detail.className!=='12'?detail.className:(detail.activity||self.periods[code]),room=detail.location&&detail.location!=='12'?detail.location:'Room —';selfInfo='<span class="self-lesson" style="color:'+esc(selfColor)+'"><strong>'+esc(classLabel)+'</strong><small>'+esc(room)+'</small></span>'}}
      out+='<button class="period-cell '+state+' availability-'+level+(activePeriod===code?' active':'')+(commonOnly&&!allFree?' muted':'')+'" data-period="'+code+'" aria-label="'+esc(code)+': '+freeTeachers.length+' free, '+busyTeachers.length+' occupied">'+selfInfo+'<span class="busy-initials">'+initials+'</span></button>';
    }
    out+='</div>';
  }
  out+='</div>'; document.getElementById('schedule').innerHTML=out;
  document.querySelectorAll('[data-period]').forEach(button=>button.addEventListener('click',()=>{activePeriod=button.dataset.period;saveState();renderSchedule();renderDetail()}));
}

function renderDetail(){
  const chosen=selectedAll();
  const prefix=activePeriod.startsWith('TH')?'TH':activePeriod[0];
  const day=DAYS.find(d=>d.short===prefix);
  let cards=chosen.map(t=>{const value=t.periods[activePeriod],state=status(value),label=state==='free'?'FREE':state==='unknown'?'?':esc(value),p=profile(t),hidden=hiddenIds.includes(t.id);return '<div class="detail-card '+state+(hidden?' temporarily-hidden':'')+'" draggable="true" data-drag-id="'+t.id+'"><span class="drag-handle" title="Drag to reorder">⋮⋮</span><span class="mini-avatar" style="background:'+esc(p.color)+';color:'+textColor(p.color)+'">'+esc(p.emoji||t.shortName||t.englishName[0])+'</span><div><strong>'+esc(t.englishName)+(yourselfId===t.id?'<span class="yourself-tag">You</span>':'')+'</strong><small>'+esc(t.chineseName)+'</small></div><b>'+label+'</b><label class="mini-toggle" title="Temporarily include or hide"><input type="checkbox" data-temp-toggle="'+t.id+'" '+(hidden?'':'checked')+'></label><button class="remove-teacher" data-remove="'+t.id+'" title="Remove from selection">×</button></div>'}).join('');
  document.getElementById('detail').innerHTML='<div class="detail-title"><span>'+activePeriod+'</span><div><h2>'+day.name+'</h2><p>Lesson '+activePeriod.match(/\d+/)[0]+'</p></div></div><div class="legend"><span><i class="legend-dot free-dot"></i> Free</span><span><i class="legend-dot busy-dot"></i> Teaching</span><span><i class="legend-dot unknown-dot"></i> Unknown</span></div><div class="detail-list">'+(cards||'<div class="detail-empty">No teachers selected</div>')+'</div><div class="rule-note"><strong>Selection controls</strong><p>Untick to hide a teacher temporarily, drag to reorder, or use × to remove.</p></div>';
  document.querySelectorAll('[data-temp-toggle]').forEach(input=>input.addEventListener('change',()=>{const id=Number(input.dataset.tempToggle);hiddenIds=input.checked?hiddenIds.filter(x=>x!==id):[...new Set([...hiddenIds,id])];renderSchedule();renderDetail()}));
  document.querySelectorAll('[data-remove]').forEach(button=>button.addEventListener('click',()=>{const id=Number(button.dataset.remove);selectedIds=selectedIds.filter(x=>x!==id);hiddenIds=hiddenIds.filter(x=>x!==id);if(yourselfId===id)yourselfId=null;saveState();renderAll()}));
  document.querySelectorAll('[data-drag-id]').forEach(card=>{card.addEventListener('dragstart',()=>{draggedId=Number(card.dataset.dragId);card.classList.add('dragging')});card.addEventListener('dragend',()=>{draggedId=null;card.classList.remove('dragging')});card.addEventListener('dragover',event=>event.preventDefault());card.addEventListener('drop',event=>{event.preventDefault();const targetId=Number(card.dataset.dragId);if(!draggedId||draggedId===targetId)return;const next=selectedIds.filter(id=>id!==draggedId),targetIndex=next.indexOf(targetId);next.splice(targetIndex,0,draggedId);selectedIds=next;saveState();renderAll()})});
}

function renderAll(){renderTeachers();renderSchedule();renderDetail()}
document.getElementById('toggle-left').addEventListener('click',()=>{leftCollapsed=!leftCollapsed;saveState();applyPanels()});
document.getElementById('toggle-right').addEventListener('click',()=>{rightCollapsed=!rightCollapsed;saveState();applyPanels()});
document.getElementById('search').addEventListener('input',event=>{query=event.target.value;renderTeachers()});
document.getElementById('clear-btn').addEventListener('click',()=>{selectedIds=[];saveState();renderAll()});
document.getElementById('reset-style-btn').addEventListener('click',()=>{customizations={};saveState();renderAll()});
document.getElementById('common-only').checked=commonOnly;
document.getElementById('common-only').addEventListener('change',event=>{commonOnly=event.target.checked;saveState();renderSchedule()});
document.getElementById('show-free').checked=showFree;
document.getElementById('show-free').addEventListener('change',event=>{showFree=event.target.checked;saveState();renderSchedule()});
applyPanels();
renderAll();
</script>
</body>
</html>
